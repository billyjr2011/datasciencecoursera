name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: Server — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ttmip/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
