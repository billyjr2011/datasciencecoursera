  --bg:#07090D; --surface:#0C1118; --panel:#111923; --panel2:#141F2B;
  --border:#192433; --border2:#1F3044;
  --accent:#E8873A; --accent2:#F4A233; --accent3:#FBC05A;
  --green:#1A9E5F; --green2:#22C97A; --green3:#A8F5D0;
  --red:#D94040; --red2:#FF6060;
  --blue:#2272C3; --blue2:#3A9FE8; --blue3:#A8D8FF;
  --purple:#7B52C8; --purple2:#A07EEF;
  --teal:#0DA88C; --teal2:#1ECFB0;

  --cam-green:#007A5E; --cam-red:#CE1126; --cam-yellow:#FCD116;

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.018) 3px,rgba(0,0,0,0.018) 4px);pointer-events:none;z-index:9000;}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;position:sticky;top:0;z-index:500;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:30px;height:30px;background:linear-gradient(135deg,var(--cam-green) 0%,var(--cam-red) 100%);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;}
.logo-text{font-family:'Syne',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:0.01em;}
.logo-sub{font-size:9px;color:var(--text3);letter-spacing:0.09em;text-transform:uppercase;font-family:'DM Mono',monospace;}
.nav-tabs{display:flex;gap:2px;}
.nav-tab{padding:5px 11px;border-radius:5px;font-size:11.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all 0.15s;color:var(--text2);user-select:none;}
.nav-tab:hover{color:var(--text);background:var(--panel);}
.nav-tab.active{background:rgba(232,135,58,0.13);color:var(--accent);border-color:rgba(232,135,58,0.22);font-weight:600;}
.nav-tab.reg-tab.active{background:rgba(123,82,200,0.13);color:var(--purple2);border-color:rgba(123,82,200,0.22);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.live-badge{display:flex;align-items:center;gap:5px;background:rgba(34,201,122,0.09);border:1px solid rgba(34,201,122,0.2);border-radius:20px;padding:4px 10px;font-size:10px;color:var(--green2);font-family:'DM Mono',monospace;}
.live-dot{width:5px;height:5px;background:var(--green2);border-radius:50%;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.icon-btn{width:32px;height:32px;background:var(--panel);border:1px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;position:relative;transition:all 0.15s;}
.icon-btn:hover{border-color:var(--accent);}
.badge-dot{position:absolute;top:-4px;right:-4px;background:var(--red);width:15px;height:15px;border-radius:50%;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'DM Mono',monospace;border:2px solid var(--bg);}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:3px 10px 3px 3px;cursor:pointer;transition:all 0.15s;}
.user-chip:hover{border-color:var(--accent);}
.user-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}

/* TICKER */
.ticker-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:4px 20px;overflow:hidden;white-space:nowrap;}
.ticker-inner{display:inline-flex;gap:28px;animation:tick 60s linear infinite;}
@keyframes tick{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.ticker-item{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-family:'DM Mono',monospace;}
.tn{color:var(--text2);}.tp{color:var(--text);font-weight:500;}.tc{font-size:9px;}
.tc.up{color:var(--green2);}.tc.dn{color:var(--red2);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 52px - 36px);}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 0;overflow-y:auto;}
.sidebar-label{font-size:8.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);padding:10px 13px 4px;font-family:'DM Mono',monospace;}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all 0.13s;margin:1px 7px;border-radius:6px;user-select:none;border:1px solid transparent;}
.sidebar-item:hover{background:var(--panel);color:var(--text);}
.sidebar-item.active{background:rgba(232,135,58,0.1);color:var(--accent);border-color:rgba(232,135,58,0.18);}
.sidebar-item.reg-item.active{background:rgba(123,82,200,0.1);color:var(--purple2);border-color:rgba(123,82,200,0.18);}
.s-icon{font-size:13px;width:16px;text-align:center;}
.s-badge{margin-left:auto;background:var(--red);color:#fff;font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:8px;font-family:'DM Mono',monospace;}
.s-badge.warn{background:var(--accent2);color:#000;}
.s-badge.purple{background:var(--purple);color:#fff;}
hr.sdiv{border:none;border-top:1px solid var(--border);margin:7px 11px;}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px 10px 10px;}
.sp-pill{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:3px 6px;font-size:8.5px;color:var(--text2);font-family:'DM Mono',monospace;cursor:pointer;transition:all 0.13s;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp-pill:hover{border-color:var(--text3);color:var(--text);}
.sp-pill.active{border-color:var(--accent);color:var(--accent);background:rgba(232,135,58,0.07);}
.src-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.src-dot.green{background:var(--green2);}
.src-dot.yellow{background:var(--accent2);}
.src-dot.red{background:var(--red);}

/* MAIN */
.main{padding:18px 20px;display:flex;flex-direction:column;gap:16px;overflow-x:hidden;}
.tab-page{display:none;flex-direction:column;gap:16px;}
.tab-page.active{display:flex;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;}
.page-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.02em;}
.page-subtitle{font-size:11px;color:var(--text3);margin-top:3px;}
.time-range{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:3px;}
.tr-btn{padding:4px 10px;border-radius:4px;font-size:10.5px;font-weight:600;cursor:pointer;transition:all 0.13s;color:var(--text2);font-family:'DM Mono',monospace;user-select:none;}
.tr-btn.active{background:var(--accent);color:#fff;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;transition:transform 0.18s,box-shadow 0.18s;cursor:pointer;user-select:none;}
.kpi-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,0.45);}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0;}
.kpi-card.orange::before{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.kpi-card.green::before{background:linear-gradient(90deg,var(--green),var(--green2));}
.kpi-card.blue::before{background:linear-gradient(90deg,var(--blue),var(--blue2));}
.kpi-card.red::before{background:linear-gradient(90deg,var(--red),var(--red2));}
.kpi-card.purple::before{background:linear-gradient(90deg,var(--purple),var(--purple2));}
.kpi-label{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:0.12em;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:7px;}
.kpi-value{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1;letter-spacing:-0.03em;margin-bottom:6px;}
.kpi-meta{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2);}
.kpi-chg{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:3px;font-family:'DM Mono',monospace;}
.kpi-chg.up{background:rgba(34,201,122,0.13);color:var(--green2);}
.kpi-chg.dn{background:rgba(217,64,64,0.13);color:var(--red2);}
.kpi-icon{position:absolute;right:12px;bottom:10px;font-size:26px;opacity:0.18;}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--border);}
.card-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;}
.card-actions{display:flex;gap:4px;align-items:center;}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:9.5px;font-weight:600;color:var(--text3);cursor:pointer;transition:all 0.13s;font-family:'DM Mono',monospace;user-select:none;}
.chip:hover{border-color:var(--text3);color:var(--text);}
.chip.active{border-color:var(--accent);color:var(--accent);background:rgba(232,135,58,0.08);}
.chip.purple{border-color:var(--purple);color:var(--purple2);background:rgba(123,82,200,0.08);}
.card-body{padding:13px 15px;}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
.g31{display:grid;grid-template-columns:3fr 1fr;gap:14px;}
.g12{display:grid;grid-template-columns:1fr 2fr;gap:14px;}
.g211{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}
.g121{display:grid;grid-template-columns:1fr 2fr 1fr;gap:14px;}

/* STATUS BADGES */
.sbadge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;font-family:'DM Mono',monospace;}
.sbadge.green{background:rgba(34,201,122,0.12);color:var(--green2);border:1px solid rgba(34,201,122,0.18);}
.sbadge.yellow{background:rgba(244,162,51,0.12);color:var(--accent2);border:1px solid rgba(244,162,51,0.18);}
.sbadge.red{background:rgba(217,64,64,0.12);color:var(--red2);border:1px solid rgba(217,64,64,0.18);}
.sbadge.blue{background:rgba(58,159,232,0.12);color:var(--blue2);border:1px solid rgba(58,159,232,0.18);}
.sbadge.purple{background:rgba(123,82,200,0.12);color:var(--purple2);border:1px solid rgba(123,82,200,0.18);}
.sbadge.gold{background:rgba(212,162,42,0.12);color:var(--gold2);border:1px solid rgba(212,162,42,0.18);}
.sbadge.teal{background:rgba(30,207,176,0.12);color:var(--teal2);border:1px solid rgba(30,207,176,0.18);}

/* TABLES */
.data-table{width:100%;font-size:11px;border-collapse:collapse;}
.data-table th{text-align:left;font-size:8.5px;font-weight:700;color:var(--text3);letter-spacing:0.11em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:2;}
.data-table td{padding:6px 8px;border-bottom:1px solid rgba(25,36,51,0.7);vertical-align:middle;}
.data-table tr{cursor:pointer;transition:background 0.1s;}
.data-table tr:hover td{background:rgba(255,255,255,0.02);}
.data-table tr:last-child td{border-bottom:none;}
.tscroll{overflow-y:auto;max-height:320px;}

/* BAR CHART */
.bar-chart{display:flex;flex-direction:column;gap:8px;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-label{font-size:9.5px;color:var(--text2);flex-shrink:0;font-family:'DM Mono',monospace;}
.bar-track{flex:1;height:8px;background:var(--border);border-radius:5px;overflow:hidden;cursor:pointer;}
.bar-fill{height:100%;border-radius:5px;transition:width 0.9s cubic-bezier(.4,0,.2,1);}
.bar-val{font-size:9.5px;font-weight:600;color:var(--text2);width:52px;text-align:right;font-family:'DM Mono',monospace;flex-shrink:0;}

/* GAUGE */
.gauge-ring{position:relative;width:64px;height:64px;}
.gauge-svg{transform:rotate(-90deg);}
.gauge-track{fill:none;stroke:var(--border);stroke-width:7;}
.gauge-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1);}
.gauge-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;}

/* MAP */
.map-container{position:relative;background:#060D14;border-radius:7px;overflow:hidden;}
.map-alert-dot{position:absolute;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%);transition:transform 0.15s;}
.map-alert-dot:hover{transform:translate(-50%,-50%) scale(1.6);z-index:10;}
.map-ripple{position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ripOut 2.2s ease-out infinite;}
@keyframes ripOut{0%{transform:scale(0.7);opacity:0.8;}100%{transform:scale(2.2);opacity:0;}}
.map-tt{position:absolute;background:rgba(7,9,13,0.96);border:1px solid var(--border2);border-radius:6px;padding:8px 11px;font-size:10px;pointer-events:none;backdrop-filter:blur(14px);display:none;z-index:20;min-width:160px;font-family:'DM Mono',monospace;line-height:1.5;}
.map-overlay{position:absolute;bottom:7px;left:7px;background:rgba(7,9,13,0.88);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:9px;backdrop-filter:blur(8px);}
.ml-item{display:flex;align-items:center;gap:5px;color:var(--text2);margin-bottom:2px;}
.ml-dot{width:6px;height:6px;border-radius:50%;}

/* CHART TT */
.chart-tt{position:absolute;background:rgba(7,9,13,0.96);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;font-size:10px;pointer-events:none;backdrop-filter:blur(14px);display:none;z-index:50;min-width:175px;}
.tt-head{font-size:8.5px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:5px;letter-spacing:0.1em;text-transform:uppercase;}
.tt-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:10.5px;}
.tt-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.tt-lbl{color:var(--text2);flex:1;}
.tt-val{font-family:'DM Mono',monospace;font-weight:600;}

/* TOAST */
.toast-container{position:fixed;top:60px;right:18px;z-index:800;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.toast{background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:11.5px;max-width:290px;pointer-events:all;animation:tIn .32s cubic-bezier(.4,0,.2,1) both;display:flex;align-items:flex-start;gap:9px;cursor:pointer;}
@keyframes tIn{from{transform:translateX(110%);opacity:0;}to{transform:none;opacity:1;}}
.toast-out{animation:tOut .28s ease both;}
@keyframes tOut{to{transform:translateX(110%);opacity:0;}}
.t-icon{font-size:15px;flex-shrink:0;margin-top:1px;}
.t-title{font-weight:600;color:var(--text);margin-bottom:1px;font-family:'Syne',sans-serif;font-size:11.5px;}
.t-msg{color:var(--text2);font-size:10.5px;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:700;display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px);}
.modal-backdrop.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:12px;width:560px;max-width:96vw;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;animation:mIn .28s cubic-bezier(.4,0,.2,1) both;}
@keyframes mIn{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;}
.modal-close{width:26px;height:26px;border-radius:5px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;transition:all 0.13s;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{padding:16px 18px;overflow-y:auto;}
.modal-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);font-size:11.5px;gap:12px;}
.modal-row:last-child{border:none;}
.modal-key{color:var(--text2);font-family:'DM Mono',monospace;font-size:10px;flex-shrink:0;}
.modal-val{font-weight:500;text-align:right;}

/* SEARCH BAR */
.search-bar{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 10px;transition:border-color 0.13s;}
.search-bar:focus-within{border-color:var(--accent);}
.search-bar input{background:none;border:none;color:var(--text);font-size:11px;font-family:'IBM Plex Sans',sans-serif;outline:none;width:145px;}
.search-bar input::placeholder{color:var(--text3);}

/* PANEL TABS */
.ptabs{display:flex;gap:2px;}
.ptab{padding:3px 9px;border-radius:4px;font-size:9.5px;font-weight:600;cursor:pointer;color:var(--text3);transition:all 0.13s;font-family:'DM Mono',monospace;user-select:none;}
.ptab:hover{color:var(--text2);}
.ptab.active{background:var(--panel2);color:var(--accent);}

/* ALERT DROPDOWN */
.alert-dropdown{position:absolute;top:40px;right:0;width:290px;background:var(--panel);border:1px solid var(--border2);border-radius:9px;box-shadow:0 16px 40px rgba(0,0,0,0.65);z-index:600;display:none;overflow:hidden;animation:dIn .2s ease both;}
@keyframes dIn{from{transform:translateY(-8px);opacity:0;}to{transform:none;opacity:1;}}
.alert-dropdown.open{display:block;}
.ad-header{padding:10px 13px;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;}
.ad-item{display:flex;gap:9px;padding:9px 13px;border-bottom:1px solid rgba(25,36,51,0.5);cursor:pointer;transition:background 0.1s;font-size:11px;}
.ad-item:hover{background:rgba(255,255,255,0.02);}
.ad-item:last-child{border:none;}
.ad-icon{font-size:16px;}
.ad-title{font-weight:600;margin-bottom:1px;font-size:11px;}
.ad-meta{font-size:9.5px;color:var(--text2);font-family:'DM Mono',monospace;}

/* FOOTER */
.footer{background:var(--surface);border-top:1px solid var(--border);padding:7px 20px;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;}
.footer-stats{display:flex;gap:12px;}
.fstat{display:flex;align-items:center;gap:4px;}
.fdot{width:5px;height:5px;border-radius:50%;}

/* ─── REGULATORY FRAMEWORK MODULE STYLES ─── */
.reg-hero{background:linear-gradient(135deg,rgba(123,82,200,0.15) 0%,rgba(34,114,195,0.1) 50%,rgba(0,0,0,0) 100%);border:1px solid rgba(123,82,200,0.2);border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;}
.reg-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(123,82,200,0.12) 0%,transparent 70%);pointer-events:none;}
.reg-hero-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--purple2);margin-bottom:4px;}
.reg-hero-sub{font-size:11px;color:var(--text2);line-height:1.5;}
.reg-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.reg-kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:13px 15px;cursor:pointer;transition:transform 0.17s,box-shadow 0.17s;position:relative;overflow:hidden;}
.reg-kpi-card:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,0.4);}
.reg-kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:9px 9px 0 0;background:linear-gradient(90deg,var(--purple),var(--blue2));}
.rkpi-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--purple2);margin-bottom:4px;}
.rkpi-label{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;}
.rkpi-sub{font-size:10px;color:var(--text2);}

/* REGULATION CARD */
.reg-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden;transition:border-color 0.18s,box-shadow 0.18s;cursor:pointer;}
.reg-card:hover{border-color:var(--purple);box-shadow:0 0 0 1px rgba(123,82,200,0.15),0 8px 24px rgba(0,0,0,0.35);}
.reg-card-header{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;}
.reg-flag{font-size:22px;flex-shrink:0;}
.reg-name{font-family:'Syne',sans-serif;font-size:12.5px;font-weight:700;margin-bottom:3px;}
.reg-full{font-size:9.5px;color:var(--text2);line-height:1.4;}
.reg-market{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);margin-top:4px;}
.reg-card-body{padding:12px 15px;}
.reg-meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:10.5px;}
.reg-meta-key{color:var(--text2);}
.reg-meta-val{font-family:'DM Mono',monospace;font-weight:600;}
.reg-impact-bar{margin-top:8px;}
.rib-label{font-size:8.5px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:3px;display:flex;justify-content:space-between;}
.rib-track{height:7px;background:var(--border);border-radius:4px;overflow:hidden;}
.rib-fill{height:100%;border-radius:4px;transition:width 1s ease;}
.reg-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;}
.reg-tag{font-size:8.5px;padding:2px 7px;border-radius:3px;font-family:'DM Mono',monospace;font-weight:600;}
.reg-tag.green{background:rgba(34,201,122,0.1);color:var(--green2);border:1px solid rgba(34,201,122,0.15);}
.reg-tag.red{background:rgba(217,64,64,0.1);color:var(--red2);border:1px solid rgba(217,64,64,0.15);}
.reg-tag.yellow{background:rgba(244,162,51,0.1);color:var(--accent2);border:1px solid rgba(244,162,51,0.15);}
.reg-tag.blue{background:rgba(58,159,232,0.1);color:var(--blue2);border:1px solid rgba(58,159,232,0.15);}
.reg-tag.purple{background:rgba(123,82,200,0.1);color:var(--purple2);border:1px solid rgba(123,82,200,0.15);}
.reg-tag.gray{background:rgba(106,145,176,0.1);color:var(--text2);border:1px solid rgba(106,145,176,0.15);}

/* IMPACT HEATMAP */
.heat-grid{display:grid;gap:3px;}
.heat-cell{display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:8.5px;font-weight:700;font-family:'DM Mono',monospace;cursor:pointer;transition:transform 0.12s;aspect-ratio:1.8;}
.heat-cell:hover{transform:scale(1.08);z-index:2;}
.heat-row-label{font-size:8.5px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;display:flex;align-items:center;}
.heat-col-label{font-size:7.5px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;white-space:nowrap;overflow:hidden;padding:2px 1px;}

/* COMPLIANCE RING */
.comp-ring{position:relative;width:76px;height:76px;flex-shrink:0;}
.cr-svg{transform:rotate(-90deg);}
.cr-track{fill:none;stroke:var(--border);stroke-width:8;}
.cr-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.3s ease;}
.cr-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.cr-pct{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;line-height:1;}
.cr-sub{font-size:7.5px;color:var(--text3);font-family:'DM Mono',monospace;}

/* MARKET FLAG TABLE */
.market-flag{font-size:16px;margin-right:5px;}
.price-cell{font-family:'DM Mono',monospace;color:var(--accent);}
.trend-up{color:var(--green2);font-family:'DM Mono',monospace;font-size:9.5px;}
.trend-dn{color:var(--red2);font-family:'DM Mono',monospace;font-size:9.5px;}
.vol-bar-inline{display:inline-block;width:50px;height:5px;background:var(--border);border-radius:3px;vertical-align:middle;overflow:hidden;margin-right:5px;}
.vol-bar-fill{height:100%;border-radius:3px;background:var(--blue2);}

/* RISK MATRIX */
.risk-matrix-wrap{overflow-x:auto;}
.risk-score-high{color:var(--red2);font-family:'DM Mono',monospace;font-weight:700;}
.risk-score-med{color:var(--accent2);font-family:'DM Mono',monospace;font-weight:700;}
.risk-score-low{color:var(--green2);font-family:'DM Mono',monospace;font-weight:700;}

/* SELECT */

 * Design goal: the API returns the SAME shapes the dashboard already renders, so
 * hydration is a straight assignment — no rendering rewrite. If the API is
 * unreachable (offline demo, outage), \`hydrate()\` resolves to \`null\` and the UI
 * falls back to its built-in deterministic generators.
 */
(function () {
  // Same-origin by default (the API also serves this file). Override by setting
  // window.TTMIP_API_BASE before this script loads (e.g. a separate API host).
  var BASE = (window.TTMIP_API_BASE || '') + '/api/v1';

  async function get(path, params) {
    var url = BASE + path;
    if (params) {
      var qs = Object.entries(params)
        .filter(function (e) { return e[1] != null && e[1] !== ''; })
        .map(function (e) { return encodeURIComponent(e[0]) + '=' + encodeURIComponent(e[1]); })
        .join('&');
      if (qs) url += '?' + qs;
    }
    var res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('API ' + res.status + ' for ' + path);
    var body = await res.json();
    return body.data;
  }

  var api = {
    dashboard: function () { return get('/dashboard/summary'); },
    species: function () { return get('/reference/species'); },
    markets: function () { return get('/reference/markets'); },
    prices: function (filters) { return get('/prices', filters); },
    indices: function () { return get('/indices'); },
    index: function (code) { return get('/indices/' + code); },
    esg: function () { return get('/esg'); },
    certificates: function (filters) { return get('/certificates', filters); },
    alerts: function (filters) { return get('/alerts', filters); },
    ddra: function (filters) { return get('/ddra', filters); },
    regulations: function (filters) { return get('/regulations', filters); },
  };

  /**
   * Loads the dynamic datasets in parallel and normalizes them to the exact
   * shapes the dashboard's render functions expect. Returns \`null\` on any
   * failure so callers can fall back cleanly.
   */
  async function hydrate() {
    try {
      var results = await Promise.all([
        api.prices({ limit: 200 }),
        api.alerts({ limit: 30 }),
        api.esg(),
        api.certificates(),
        api.ddra(),
      ]);
      var prices = results[0].map(function (p) {
        return {
          id: p.id, platform: p.platform, species: p.species,
          destination: p.destination, destName: p.destName,
          price: p.price, volume: p.volume, quality: p.quality,
          ts: new Date(p.ts),
        };
      });
      return { prices: prices, alerts: results[1], esg: results[2], certs: results[3], ddra: results[4] };
    } catch (err) {
      console.warn('[TTMIP] API hydrate failed — using built-in demo data.', err);
      return null;
    }
  }

  /** Reflects live vs demo state in the topbar live badge. */
  function setMode(mode) {
    var live = document.querySelector('.live-badge');
    if (!live) return;
    if (mode === 'LIVE') {
      live.title = 'Connected to TTMIP API';
    } else {
      live.title = 'Offline demo data (API unreachable)';
      live.style.borderColor = 'rgba(244,162,51,0.3)';
      var dot = live.querySelector('.live-dot');
      if (dot) dot.style.background = 'var(--accent2)';
    }
  }

  window.TTMIP = { api: api, hydrate: hydrate, setMode: setMode };
})();

;

const rnd=(a,b)=>+(Math.random()*(b-a)+a).toFixed(2);
const rndI=(a,b)=>Math.floor(Math.random()*(b-a+1)+a);
const pick=arr=>arr[rndI(0,arr.length-1)];

let priceData=[], alertData=[], esgData=[], certData=[], ddraData=[];
let activeAlertFilter='all', certFilter='', mktSort='volume', regRegionFilter='all', heatMode='species';

function genPrices(n=200){
  return Array.from({length:n},(_,i)=>({
    id:i+1, platform:pick(PLATFORMS),
    species:pick(SPECIES_30),
    destination:pick(MARKETS_15).code,
    destName:null,
    price:rnd(420,1450), volume:rndI(80,9000),
    quality:Math.random()<0.68?'High':Math.random()<0.65?'Medium':'Low',
    ts:new Date(Date.now()-rndI(0,3600)*1000)
  })).map(r=>{r.destName=MARKETS_15.find(m=>m.code===r.destination)?.name||r.destination;return r;});
}

function genAlerts(n=30){
  const zones=['Lobéké NP','Dja Reserve','Campo-Ma\\'an','Ngoyla-Mintom','Mbam & Djerem','Bénoué NP','Waza NP','Boumba-Bek','Takamanda NR','Korup NP'];
  return Array.from({length:n},(_,i)=>{
    const confidence=rnd(0.3,0.98);
    const severity=confidence>=0.8?'High':confidence>=0.5?'Medium':'Low';
    return {
      id:\`ALERT-\${new Date().toISOString().slice(0,10).replace(/-/g,'')}-\${String(i+1).padStart(3,'0')}\`,
      lat:rnd(2,13),lng:rnd(8,16),confidence,
      date:new Date(Date.now()-rndI(1,30)*86400000).toISOString().slice(0,10),
      area:rnd(0.1,25),source:pick(['GFW','WRI','NASA','EU JRC']),zone:pick(zones),
      severity
    };
  });
}

function genESG(){
  return COMPANIES.map(c=>{
    const env=rndI(38,92),soc=rndI(40,90),gov=rndI(32,85);
    const overall=+((env+soc+gov)/3).toFixed(1);
    const risk=overall>=70?'Low':overall>=50?'Medium':overall>=30?'High':'Critical';
    return {company:c,env,soc,gov,overall,risk,
      date:new Date(Date.now()-rndI(1,90)*86400000).toISOString().slice(0,10)};
  });
}

function genCerts(n=50){
  return Array.from({length:n},(_,i)=>{
    const issue=new Date(Date.now()-rndI(30,1095)*86400000);
    const expiry=new Date(issue.getTime()+3*365*86400000);
    const daysLeft=Math.round((expiry-Date.now())/86400000);
    const type=pick(['FSC','PEFC','Both','None']);
    return {id:\`CONC-\${String(i+1).padStart(3,'0')}\`,name:pick(COMPANIES),type,
      issue:issue.toISOString().slice(0,10),expiry:expiry.toISOString().slice(0,10),daysLeft,
      status:type==='None'?'No Cert':daysLeft>90?'Active':daysLeft>0?'Expiring':'Expired'};
  });
}

function genDDRA(n=100){
  return Array.from({length:n},(_,i)=>{
    const risk=rnd(0,10);
    return {id:\`SHIP-\${new Date().toISOString().slice(0,7).replace('-','')}-\${String(i+1).padStart(4,'0')}\`,
      company:pick(COMPANIES),risk,
      date:new Date(Date.now()-rndI(1,60)*86400000).toISOString().slice(0,10),
      status:risk<=3?'Compliant':risk<=6?'Under Review':risk<=8?'Non-Compliant':'Critical'};
  });
}

function drawLineChart(canvas,datasets,labels,opts={}){
  if(!canvas)return;
  const W=canvas.offsetWidth||560,H=canvas.offsetHeight||200;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  const ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,W,H);
  const P={t:8,r:8,b:opts.xLabels?24:6,l:opts.yLabels?38:6};
  const cW=W-P.l-P.r,cH=H-P.t-P.b;
  const allV=datasets.flatMap(d=>d.data.filter(v=>v!=null));
  const minV=opts.minV??Math.min(...allV)*0.93,maxV=opts.maxV??Math.max(...allV)*1.05;
  const xOf=i=>P.l+(i/(labels.length-1))*cW;
  const yOf=v=>P.t+(1-(v-minV)/(maxV-minV))*cH;
  ctx.strokeStyle='rgba(25,36,51,0.9)';ctx.lineWidth=0.5;
  for(let g=0;g<=4;g++){const y=P.t+g*(cH/4);ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();}
  if(opts.yLabels){ctx.fillStyle='rgba(46,74,98,0.9)';ctx.font=\`8px 'DM Mono',monospace\`;for(let g=0;g<=4;g++){const v=maxV-(g/4)*(maxV-minV);ctx.fillText(Math.round(v),1,P.t+g*(cH/4)+3);}}
  if(opts.xLabels){ctx.fillStyle='rgba(46,74,98,0.9)';ctx.font=\`7.5px 'DM Mono',monospace\`;ctx.textAlign='center';const step=Math.max(1,Math.floor(labels.length/7));for(let i=0;i<labels.length;i+=step)ctx.fillText(labels[i],xOf(i),H-4);ctx.textAlign='left';}
  datasets.forEach(ds=>{
    if(ds.hidden)return;
    ctx.save();
    if(ds.fill){ctx.beginPath();ds.data.forEach((v,i)=>{if(v==null)return;i===0?ctx.moveTo(xOf(i),yOf(v)):ctx.lineTo(xOf(i),yOf(v));});ctx.lineTo(xOf(ds.data.length-1),P.t+cH);ctx.lineTo(P.l,P.t+cH);ctx.closePath();const g=ctx.createLinearGradient(0,P.t,0,P.t+cH);g.addColorStop(0,ds.color+'44');g.addColorStop(1,ds.color+'00');ctx.fillStyle=g;ctx.fill();}
    ctx.beginPath();ctx.strokeStyle=ds.color;ctx.lineWidth=ds.w||2;ctx.lineJoin='round';if(ds.dash)ctx.setLineDash(ds.dash);
    let first=true;ds.data.forEach((v,i)=>{if(v==null)return;first?(ctx.moveTo(xOf(i),yOf(v)),first=false):ctx.lineTo(xOf(i),yOf(v));});ctx.stroke();ctx.setLineDash([]);
    const last=ds.data.length-1;if(ds.data[last]!=null){ctx.beginPath();ctx.arc(xOf(last),yOf(ds.data[last]),3,0,Math.PI*2);ctx.fillStyle=ds.color;ctx.fill();ctx.strokeStyle='#07090D';ctx.lineWidth=2;ctx.stroke();}
    ctx.restore();
  });
  if(opts.tooltip)canvas._ds={datasets,labels,xOf,yOf,P,cW,cH,W,H};
}

function drawBarChart(canvas,labels,datasets,opts={}){
  if(!canvas)return;
  const W=canvas.offsetWidth||560,H=canvas.offsetHeight||200;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  const ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,W,H);
  const P={t:6,r:8,b:opts.legend?38:24,l:40};const cW=W-P.l-P.r,cH=H-P.t-P.b;
  const nG=labels.length,nS=datasets.length,gW=cW/nG,bW=gW/(nS+0.5)*0.8;
  const allV=datasets.flatMap(d=>d.data);const maxV=Math.max(...allV)*1.1;
  ctx.strokeStyle='rgba(25,36,51,0.8)';ctx.lineWidth=0.4;
  for(let g=0;g<=4;g++){const y=P.t+g*(cH/4);ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='rgba(46,74,98,0.85)';ctx.font=\`7.5px 'DM Mono',monospace\`;ctx.fillText(Math.round(maxV-(g/4)*maxV),2,y+3);}
  datasets.forEach((ds,si)=>{
    ds.data.forEach((v,gi)=>{
      const x=P.l+gi*gW+si*bW+(gW-nS*bW)/2;const bH=(v/maxV)*cH;const y=P.t+cH-bH;
      const g=ctx.createLinearGradient(0,y,0,y+bH);g.addColorStop(0,ds.color+'EE');g.addColorStop(1,ds.color+'55');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+2,y);ctx.lineTo(x+bW-2,y);ctx.quadraticCurveTo(x+bW,y,x+bW,y+2);ctx.lineTo(x+bW,y+bH-2);ctx.quadraticCurveTo(x+bW,y+bH,x+bW-2,y+bH);ctx.lineTo(x+2,y+bH);ctx.quadraticCurveTo(x,y+bH,x,y+bH-2);ctx.lineTo(x,y+2);ctx.quadraticCurveTo(x,y,x+2,y);ctx.closePath();ctx.fill();
    });
  });
  ctx.fillStyle='rgba(46,74,98,0.9)';ctx.font=\`7.5px 'DM Mono',monospace\`;ctx.textAlign='center';
  labels.forEach((l,i)=>ctx.fillText(l.length>6?l.slice(0,5)+'…':l,P.l+i*gW+gW/2,H-P.b+11));
  if(opts.legend&&datasets.length>1){let lx=P.l;datasets.forEach(ds=>{ctx.fillStyle=ds.color;ctx.fillRect(lx,H-12,8,5);ctx.fillStyle='rgba(106,145,176,0.8)';ctx.textAlign='left';ctx.font=\`7.5px 'DM Mono',monospace\`;ctx.fillText(ds.label,lx+11,H-8);lx+=ctx.measureText(ds.label).width+22;});}
}

function getPriceSeries(range='1M'){
  const n={ONE_WEEK:8,'1W':8,'1M':16,'3M':26,'1Y':52,'ALL':120}[range]||16;
  const labels=Array.from({length:n},(_,i)=>{const d=new Date(Date.now()-((n-1-i)*(range==='1Y'||range==='ALL'?7:2))*86400000);return d.toLocaleDateString('en',{month:'short',day:'numeric'});});
  const s=(b,v)=>Array.from({length:n},()=>{b+=rnd(-v,v);return +Math.max(280,b).toFixed(0);});
  return {labels,cam:s(860,28),bra:s(810,24),idn:s(700,20),mly:s(740,22)};
}

  drawLineChart(c,ds,labels,{yLabels:true,xLabels:true,tooltip:true});

function setupChartTT(canvas,ttId,labels,datasets){
  const tt=document.getElementById(ttId);if(!tt)return;
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left;
    const st=canvas._ds;if(!st)return;
    const i=Math.round((mx-st.P.l)/(st.cW/(labels.length-1)));
    if(i<0||i>=labels.length)return;
    let html=\`<div class="tt-head">\${labels[i]}</div>\`;
    datasets.forEach(ds=>{if(ds.hidden||ds.data[i]==null)return;html+=\`<div class="tt-row"><div class="tt-dot" style="background:\${ds.color}"></div><div class="tt-lbl">\${ds.label}</div><div class="tt-val">$\${ds.data[i]}/m³</div></div>\`;});
    tt.innerHTML=html;
    tt.style.left=Math.min(mx+10,rect.width-185)+'px';tt.style.top='8px';tt.style.display='block';
  };
  canvas.onmouseleave=()=>tt.style.display='none';
}

function renderRegImpactChart(){
  const c=document.getElementById('regImpactChart');if(!c)return;
  const regs=REGULATIONS.filter(r=>r.priceImpact!==0);
  const sorted=[...regs].sort((a,b)=>a.priceImpact-b.priceImpact);
  const W=c.offsetWidth||560,H=c.offsetHeight||230;
  c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
  const ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,W,H);
  const P={t:8,r:8,b:28,l:100};
  const cW=W-P.l-P.r,cH=H-P.t-P.b;
  const maxAbs=Math.max(...sorted.map(r=>Math.abs(r.priceImpact)))*1.15;
  const bH=Math.min(18,(cH/sorted.length)-3);
  const zeroX=P.l+cW*0.5;

  ctx.strokeStyle='rgba(25,36,51,0.8)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(zeroX,P.t);ctx.lineTo(zeroX,P.t+cH);ctx.stroke();
  ctx.fillStyle='rgba(46,74,98,0.7)';ctx.font=\`7.5px 'DM Mono',monospace\`;ctx.textAlign='center';
  ctx.fillText('0',zeroX,H-2);
  ['-15%','-10%','-5%','+5%','+10%'].forEach((l,i)=>{const x=zeroX+((i-2)/2)*(cW/maxAbs*5);ctx.fillText(l,x,H-2);});

  sorted.forEach((r,i)=>{
    const y=P.t+i*(cH/sorted.length)+(cH/sorted.length-bH)/2;
    const impact=r.priceImpact;
    const bW=Math.abs(impact)/maxAbs*(cW/2);
    const x=impact<0?zeroX-bW:zeroX;
    const color=impact<0?'#D94040':'#22C97A';
    const g=ctx.createLinearGradient(x,0,x+bW,0);
    g.addColorStop(0,color+(impact<0?'99':'44'));g.addColorStop(impact<0?0:1,color+'CC');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+2,y);ctx.lineTo(x+bW-2,y);ctx.quadraticCurveTo(x+bW,y,x+bW,y+2);ctx.lineTo(x+bW,y+bH-2);ctx.quadraticCurveTo(x+bW,y+bH,x+bW-2,y+bH);ctx.lineTo(x+2,y+bH);ctx.quadraticCurveTo(x,y+bH,x,y+bH-2);ctx.lineTo(x,y+2);ctx.quadraticCurveTo(x,y,x+2,y);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(106,145,176,0.9)';ctx.font=\`8px 'DM Mono',monospace\`;ctx.textAlign='right';
    ctx.fillText(r.name.slice(0,12),P.l-4,y+bH/2+3);
    ctx.fillStyle=color;ctx.font=\`7.5px 'DM Mono',monospace\`;ctx.textAlign=impact<0?'right':'left';
    const valX=impact<0?x-2:x+bW+3;ctx.fillText((impact>0?'+':'')+impact+'%',valX,y+bH/2+3);
  });
}

function renderRegHeatmap(){
  const cont=document.getElementById('heatmapContainer');if(!cont)return;
  const speciesSubset=SPECIES_30.slice(0,10);
  const regs=REGULATIONS.filter(r=>r.status==='Active').slice(0,8);
  const getRisk=(sp,reg)=>{
    const base=Math.abs(reg.priceImpact);
    const spMod={'Wengé':1.4,'Bubinga':1.4,'Ebène':1.3,'Padouk':1.1,'Sapelli':0.9,'Ayous':0.8}[sp]||1.0;
    return Math.min(10,+(base*spMod*0.8+Math.random()*1).toFixed(1));
  };
  const getColor=v=>v>=8?'rgba(217,64,64,0.85)':v>=6?'rgba(232,135,58,0.8)':v>=4?'rgba(244,162,51,0.7)':v>=2?'rgba(34,201,122,0.55)':'rgba(34,201,122,0.3)';
  const colW=Math.max(42, Math.floor((cont.offsetWidth-110)/regs.length));
  let html=\`<div style="display:grid;grid-template-columns:108px \${regs.map(()=>colW+'px').join(' ')};gap:2px;min-width:\${110+regs.length*colW}px;">\`;
  html+=\`<div class="heat-row-label" style="font-size:8px;color:var(--text3);padding-bottom:3px;"></div>\${regs.map(r=>\`<div class="heat-col-label" style="width:\${colW}px;">\${r.name.slice(0,8)}</div>\`).join('')}\`;
  speciesSubset.forEach(sp=>{
    html+=\`<div class="heat-row-label">\${sp}</div>\`;
    regs.forEach(r=>{const v=getRisk(sp,r);const c=getColor(v);html+=\`<div class="heat-cell" style="background:\${c};color:rgba(255,255,255,0.85);width:\${colW}px;" onclick="showToast('\${sp} × \${r.name}','Risk score: \${v}/10 · Impact: \${r.priceImpact}%','🔥')" title="\${sp} / \${r.name}: \${v}/10">\${v}</div>\`;});
  });
  html+='</div>';
  html+=\`<div style="display:flex;align-items:center;gap:12px;margin-top:10px;font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;">
    <span>Risk scale:</span>
    <div style="display:flex;align-items:center;gap:3px;"><div style="width:12px;height:8px;background:rgba(34,201,122,0.45);border-radius:2px;"></div>Low (0-2)</div>
    <div style="display:flex;align-items:center;gap:3px;"><div style="width:12px;height:8px;background:rgba(244,162,51,0.7);border-radius:2px;"></div>Med (4-6)</div>
    <div style="display:flex;align-items:center;gap:3px;"><div style="width:12px;height:8px;background:rgba(217,64,64,0.8);border-radius:2px;"></div>High (8+)</div>
  </div>\`;
  cont.innerHTML=html;
}

const ESG_DB={'Pallisco':{env:79,soc:71,gov:60},'Wijma':{env:65,soc:68,gov:55},'Alpicam':{env:58,soc:62,gov:72},'SFID':{env:72,soc:58,gov:45},'GRUMCAM':{env:48,soc:55,gov:60}};
function setGauge(arcId,valId,score,color,circ=150.8){
  const arc=document.getElementById(arcId),val=document.getElementById(valId);
  if(!arc||!val)return;
  const offset=circ*(1-score/100);
  arc.setAttribute('stroke-dasharray',circ);arc.setAttribute('stroke-dashoffset',offset);arc.style.stroke=color;
  val.textContent=score;val.style.color=color;
}
function updateDashESG(){
  const sel=document.getElementById('esgDashSel')?.value||'Pallisco';
  const d=ESG_DB[sel]||{env:60,soc:60,gov:60};
  setGauge('dEsgE','dEsgEV',d.env,'#22C97A');
  setGauge('dEsgS','dEsgSV',d.soc,'#3A9FE8');
  setGauge('dEsgG','dEsgGV',d.gov,'#E8873A');
}

function animateComplianceRing(arcId,pctId,target,color,circ){
  const arc=document.getElementById(arcId),pct=document.getElementById(pctId);
  if(!arc||!pct)return;
  arc.setAttribute('stroke-dasharray',circ);arc.style.stroke=color;
  setTimeout(()=>{arc.style.transition='stroke-dashoffset 1.4s ease';arc.setAttribute('stroke-dashoffset',circ*(1-target/100));let c=0;const t=setInterval(()=>{c=Math.min(c+1.2,target);pct.textContent=Math.round(c)+'%';if(c>=target)clearInterval(t);},18);},350);
}

function genCandleData(n, base) {
  if(n === undefined) n = 60;
  if(base === undefined) base = 1000;
  var candles = [];
  var price = base;
  for(var i=0;i<n;i++){
    var o=price, change=rnd(-30,35);
    var h=o+Math.abs(rnd(5,40)), l=o-Math.abs(rnd(5,40));
    var c=o+change;
    price=Math.max(300,c);
    candles.push({o:+o.toFixed(0),h:+Math.max(h,c,o).toFixed(0),l:+Math.min(l,c,o).toFixed(0),c:+Math.max(200,c).toFixed(0),v:rndI(200,3000)});
  }
  return candles;
}

function drawCandleChart(){
  var canvas=document.getElementById('candleChart');if(!canvas)return;
  var candles=genCandleData(60,currentPrice);
  var W=canvas.offsetWidth||700,H=canvas.offsetHeight||240;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  var ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,W,H);
  var P={t:10,r:10,b:24,l:55};
  var cW=W-P.l-P.r,cH=H-P.t-P.b;
  var allPrices=candles.reduce(function(a,c){return a.concat([c.h,c.l]);},[]);
  var minP=Math.min.apply(null,allPrices)*0.997,maxP=Math.max.apply(null,allPrices)*1.003;
  var xOf=function(i){return P.l+(i+0.5)*(cW/candles.length);};
  var yOf=function(v){return P.t+(1-(v-minP)/(maxP-minP))*cH;};
  var cW2=Math.max(2,(cW/candles.length)*0.65);
  ctx.strokeStyle='rgba(25,36,51,0.8)';ctx.lineWidth=0.4;
  for(var g=0;g<=5;g++){var y=P.t+g*(cH/5);ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();}
  ctx.fillStyle='rgba(46,74,98,0.7)';ctx.font="7.5px 'DM Mono',monospace";
  for(var g2=0;g2<=5;g2++){var v=maxP-(g2/5)*(maxP-minP);ctx.fillText(String.fromCharCode(36)+Math.round(v),2,P.t+g2*(cH/5)+3);}
  var ma20vals=candles.map(function(_,i){if(i<20)return null;return candles.slice(i-20,i).reduce(function(s,c){return s+c.c;},0)/20;});
  ctx.beginPath();ctx.strokeStyle='rgba(232,135,58,0.7)';ctx.lineWidth=1.2;var first=true;
  ma20vals.forEach(function(mv,i){if(!mv)return;var x=xOf(i),y2=yOf(mv);if(first){ctx.moveTo(x,y2);first=false;}else{ctx.lineTo(x,y2);}});ctx.stroke();
  candles.forEach(function(c,i){
    var x=xOf(i),up=c.c>=c.o;
    var col=up?'#22C97A':'#D94040';
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yOf(c.h));ctx.lineTo(x,yOf(c.l));ctx.stroke();
    var y3=yOf(Math.max(c.o,c.c)),bh=Math.max(1,Math.abs(yOf(c.o)-yOf(c.c)));
    ctx.fillStyle=col;ctx.fillRect(x-cW2/2,y3,cW2,bh);
  });
  ctx.fillStyle='rgba(46,74,98,0.7)';ctx.font="7.5px 'DM Mono',monospace";ctx.textAlign='center';
  [0,15,30,45,59].forEach(function(i){ctx.fillText('D-'+(59-i),xOf(i),H-4);});
}

function genTAPrices(n,base){
  if(n===undefined)n=100; if(base===undefined)base=900;
  var p=base, arr=[];
  for(var i=0;i<n;i++){p+=rnd(-18,20);arr.push(+Math.max(400,p).toFixed(0));}
  return arr;
}

function calcMA(prices,n){
  return prices.map(function(_,i){
    if(i<n-1)return null;
    return prices.slice(i-n+1,i+1).reduce(function(s,v){return s+v;},0)/n;
  });
}

function calcBollinger(prices,n,mult){
  if(n===undefined)n=20; if(mult===undefined)mult=2;
  var ma=calcMA(prices,n);
  return prices.map(function(_,i){
    if(i<n-1)return{mid:null,upper:null,lower:null};
    var slice=prices.slice(i-n+1,i+1);
    var avg=ma[i];
    var std=Math.sqrt(slice.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/n);
    return{mid:avg,upper:avg+mult*std,lower:avg-mult*std};
  });
}

function calcRSI(prices,n){
  if(n===undefined)n=14;
  var rsi=[];
  for(var k=0;k<n;k++)rsi.push(null);
  for(var i=n;i<prices.length;i++){
    var changes=[];
    for(var j=i-n+1;j<=i;j++) changes.push(prices[j]-prices[j-1]);
    var gains=changes.filter(function(c){return c>0;}).reduce(function(s,c){return s+c;},0)/n;
    var losses=Math.abs(changes.filter(function(c){return c<0;}).reduce(function(s,c){return s+c;},0))/n;
    var rs=losses===0?100:gains/losses;
    rsi.push(+(100-100/(1+rs)).toFixed(1));
  }
  return rsi;
}

function calcMACD(prices,fast,slow,signal){
  if(fast===undefined)fast=12; if(slow===undefined)slow=26; if(signal===undefined)signal=9;
  function ema(data,n){var k=2/(n+1),e=data[0];return data.map(function(v){e=v*k+e*(1-k);return +e.toFixed(2);});}
  var fastE=ema(prices,fast),slowE=ema(prices,slow);
  var macdLine=fastE.map(function(v,i){return +(v-slowE[i]).toFixed(2);});
  var sigLine=ema(macdLine,signal);
  var hist=macdLine.map(function(v,i){return +(v-sigLine[i]).toFixed(2);});
  return{macd:macdLine,signal:sigLine,hist:hist};
}

  if(rsiEl){rsiEl.textContent='RSI: '+curRSI.toFixed(1);rsiEl.className='sbadge '+(curRSI>70?'red':curRSI<30?'green':'blue');}
  var W=c.offsetWidth||500,H=c.offsetHeight||100;
  c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
  var ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,W,H);
  var P={t:5,r:5,b:5,l:30};var cW=W-P.l-P.r,cH=H-P.t-P.b;
  var data=validRsi;
  var xOf=function(i){return P.l+(i/(data.length-1))*cW;};
  var yOf=function(v){return P.t+(1-v/100)*cH;};
  ctx.fillStyle='rgba(217,64,64,0.08)';ctx.fillRect(P.l,P.t,cW,yOf(70)-P.t);

    ctx.fillStyle='rgba(46,74,98,0.7)';ctx.font="7px 'DM Mono',monospace";ctx.fillText(v,2,yOf(v)+3);
  });
  ctx.beginPath();ctx.strokeStyle=curRSI>70?'var(--red2)':curRSI<30?'var(--green2)':'var(--blue2)';ctx.lineWidth=1.8;ctx.lineJoin='round';
  data.forEach(function(v,i){if(i===0)ctx.moveTo(xOf(i),yOf(v));else ctx.lineTo(xOf(i),yOf(v));});ctx.stroke();

function drawMACDChart(){
  var c=document.getElementById('macdChart');if(!c)return;
  var result=calcMACD(taPrices);
  var macd=result.macd,signal=result.signal,hist=result.hist;
  var W=c.offsetWidth||500,H=c.offsetHeight||100;
  c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
  var ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,W,H);
  var P={t:5,r:5,b:5,l:30};var cW=W-P.l-P.r,cH=H-P.t-P.b;
  var allV=macd.concat(signal,hist).filter(function(v){return v!==null;});
  var minV=Math.min.apply(null,allV),maxV=Math.max.apply(null,allV);
  var xOf=function(i){return P.l+(i/(macd.length-1))*cW;};
  var yOf=function(v){return P.t+(1-(v-minV)/(maxV-minV))*cH;};
  var zero=yOf(0);
  ctx.strokeStyle='rgba(25,36,51,0.8)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,zero);ctx.lineTo(P.l+cW,zero);ctx.stroke();
  hist.forEach(function(v,i){if(v===null)return;var x=xOf(i),bW2=cW/hist.length*0.8;ctx.fillStyle=v>=0?'rgba(34,201,122,0.5)':'rgba(217,64,64,0.5)';ctx.fillRect(x-bW2/2,Math.min(zero,yOf(v)),bW2,Math.abs(yOf(v)-zero));});
  function drawLine(data,color){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.4;var firstL=true;data.forEach(function(v,i){if(v===null)return;if(firstL){ctx.moveTo(xOf(i),yOf(v));firstL=false;}else{ctx.lineTo(xOf(i),yOf(v));}});ctx.stroke();}
  drawLine(macd,'#3A9FE8');drawLine(signal,'#E8873A');
}

function renderTASignals(){
  var prices=taPrices;
  var lastPrice=prices[prices.length-1];
  var ma20v=calcMA(prices,20).filter(function(v){return v!==null;});
  var ma20=ma20v[ma20v.length-1];
  var ma50v=calcMA(prices,50).filter(function(v){return v!==null;});
  var ma50=ma50v[ma50v.length-1];
  var rsiArr=calcRSI(prices,14).filter(function(v){return v!==null;});
  var rsiVal=rsiArr.length?rsiArr[rsiArr.length-1]:50;
  var mResult=calcMACD(prices);
  var macdLast=mResult.macd[mResult.macd.length-1],sigLast=mResult.signal[mResult.signal.length-1];
  var bbLast=calcBollinger(prices,20,2)[prices.length-1];
  var signals=[
    {name:'Moving Avg 20/50',val:lastPrice>ma20&&lastPrice>ma50?'BUY':lastPrice<ma20&&lastPrice<ma50?'SELL':'HOLD',num:String.fromCharCode(36)+lastPrice.toFixed(0)},
    {name:'RSI (14)',val:rsiVal<30?'BUY':rsiVal>70?'SELL':'HOLD',num:rsiVal.toFixed(1)},
    {name:'MACD Signal',val:macdLast>sigLast?'BUY':'SELL',num:macdLast.toFixed(2)},
    {name:'Bollinger Bands',val:(bbLast&&lastPrice<bbLast.lower)?'BUY':(bbLast&&lastPrice>bbLast.upper)?'SELL':'HOLD',num:String.fromCharCode(36)+lastPrice.toFixed(0)},
  ];
  var cards=document.getElementById('taSignalCards');
  if(cards) cards.innerHTML=signals.map(function(s){return '<div class="signal-card"><div class="signal-name">'+s.name+'</div><div class="signal-val">'+s.num+'</div><div class="signal-action '+(s.val==='BUY'?'sig-buy':s.val==='SELL'?'sig-sell':'sig-hold')+'">'+s.val+'</div></div>';}).join('');
  var buys=signals.filter(function(s){return s.val==='BUY';}).length;
  var sells=signals.filter(function(s){return s.val==='SELL';}).length;
  var overall=buys>sells?'STRONG BUY':sells>buys?'STRONG SELL':'NEUTRAL';
  var overallEl=document.getElementById('overallSignal');
  if(overallEl){overallEl.textContent=overall;overallEl.style.color=buys>sells?'var(--green2)':sells>buys?'var(--red2)':'var(--text2)';}
  var reasonEl=document.getElementById('overallReason');
  if(reasonEl) reasonEl.textContent=buys+' BUY · '+sells+' SELL · '+(4-buys-sells)+' HOLD signals';
  var breakEl=document.getElementById('signalBreakdown');
  if(breakEl) breakEl.innerHTML=signals.map(function(s){return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:10.5px;"><span style="color:var(--text2);">'+s.name+'</span><span class="signal-action '+(s.val==='BUY'?'sig-buy':s.val==='SELL'?'sig-sell':'sig-hold')+'">'+s.val+'</span></div>';}).join('');
  var recent=prices.slice(-20);
  var h=Math.max.apply(null,recent),l=Math.min.apply(null,recent),cpp=prices[prices.length-1];
  var pivot=(h+l+cpp)/3;
  var pivEl=document.getElementById('pivotPoints');
  if(pivEl){
    var pivots=[{l:'R2',v:(pivot+(h-l)).toFixed(0),col:'red2'},{l:'R1',v:(2*pivot-l).toFixed(0),col:'red2'},{l:'PP',v:pivot.toFixed(0),col:'text'},{l:'S1',v:(2*pivot-h).toFixed(0),col:'green2'},{l:'S2',v:(pivot-(h-l)).toFixed(0),col:'green2'}];
    pivEl.innerHTML=pivots.map(function(p){return '<div style="text-align:center;padding:4px;background:var(--surface);border-radius:5px;"><div style="font-size:8.5px;color:var(--text3);font-family:\\'DM Mono\\',monospace;">'+p.l+'</div><div style="font-family:\\'DM Mono\\',monospace;font-size:10px;color:var(--'+p.col+');">$'+p.v+'</div></div>';}).join('');
  }
}

  var item=document.getElementById('faq-'+i);

  if(!item||!ans)return;
  var isOpen=item.classList.contains('open');

// ── MAIN AI ANALYSIS RUNNER ──
function runBIAnalysis() {
  var promptEl = document.getElementById('biPrompt');
  var prompt = promptEl ? promptEl.value.trim() : '';
  if (!prompt) {
    showToast('No prompt entered', 'Please enter an analysis question', 'ℹ️');
    return;
  }

  var btn = document.getElementById('biRunBtn');
  var outputArea = document.getElementById('biOutputArea');
  var responseText = document.getElementById('biResponseText');

  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin">⚙️</span><span>Analysing...</span>'; }
  if (outputArea) outputArea.style.display = 'block';
  if (responseText) responseText.innerHTML = '<div style="color:var(--text3);font-family:\\'DM Mono\\',monospace;font-size:11px;">🤖 Claude is analysing market segments<span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>';

  var includeMarket = document.getElementById('bi-include-market-data') && document.getElementById('bi-include-market-data').checked;
  var includeReg = document.getElementById('bi-include-regulatory') && document.getElementById('bi-include-regulatory').checked;
  var includeQuant = document.getElementById('bi-quantitative') && document.getElementById('bi-quantitative').checked;

  var marketContext = includeMarket ? buildMarketContext() : '';
  var regContext = includeReg ? buildRegulatoryContext() : '';

  var systemPrompt = 'You are a senior business intelligence analyst specializing in tropical timber commodity markets, with deep expertise in Cameroon forest sector economics, EU/Asia trade flows, investment analysis, and forest certification finance. You provide rigorous, data-grounded analysis using specific numbers, percentages, and market figures. You structure responses with clear sections using markdown headers (###). You are advising the Ministry of Forests and Wildlife of Cameroon (MINFOF) on market segment strategy and investment returns. Always include specific ROI figures, margin ranges, volume estimates, payback periods, and risk ratings. Be direct, quantitative, and actionable.';

  var fullPrompt = prompt + '\\n\\n';
  if (marketContext) fullPrompt += '=== CURRENT MARKET CONTEXT ===\\n' + marketContext + '\\n\\n';
  if (regContext) fullPrompt += '=== REGULATORY FRAMEWORK ===\\n' + regContext + '\\n\\n';
  if (includeQuant) fullPrompt += 'Please include specific quantitative metrics: ROI%, gross margin%, addressable market size (USD), entry costs (USD), estimated payback period (years), and a risk score (1-100). Format investment metrics in a structured way.';

  var startTime = Date.now();

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1800,
      system: systemPrompt,
      messages: [{ role: 'user', content: fullPrompt }]
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    if (data.content && data.content[0]) {
      var text = data.content[0].text;
      var tokens = data.usage ? (data.usage.input_tokens + data.usage.output_tokens) : 0;
      biTokensUsed += tokens;
      var tcEl = document.getElementById('bi-token-counter');
      if (tcEl) tcEl.textContent = biTokensUsed.toLocaleString() + ' tokens used';
      var timeEl = document.getElementById('bi-analysis-time');
      if (timeEl) timeEl.textContent = elapsed + 's · ' + tokens + ' tokens';
      if (responseText) responseText.innerHTML = formatAIResponse(text);
      populateBISections(text);
      showToast('AI Analysis Complete', 'Market segments identified · ROI models generated', '🎯');
    } else {
      if (responseText) responseText.innerHTML = '<div style="color:var(--red2);">API error: ' + JSON.stringify(data).slice(0,200) + '</div>';
    }
  })
  .catch(function(err) {
    if (responseText) responseText.innerHTML = '<div style="color:var(--red2);">Connection error: ' + err.message + '. Please check API access.</div>';
    showToast('API Error', err.message, '⚠️');
  })

    if (btn) { btn.disabled = false; btn.innerHTML = '<span>⚡</span><span>Run AI Analysis</span>'; }
  });
}

// ── FORMAT AI RESPONSE ──
function formatAIResponse(text) {
  var html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/### (.*)/g, '<h3>$1</h3>')
    .replace(/## (.*)/g, '<h3>$1</h3>')
    .replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1</strong>')
    .replace(/\\*(.*?)\\*/g, '<em>$1</em>')
    .replace(/^- (.*)/gm, '<li>$1</li>')
    .replace(/^[0-9]+\\. (.*)/gm, '<li>$1</li>')
    .replace(/(<li>.*<\\/li>)/s, '<ul>$1</ul>')
    .replace(/\`(.*?)\`/g, '<code style="background:var(--panel);padding:1px 5px;border-radius:3px;font-family:\\'DM Mono\\',monospace;font-size:10px;">$1</code>')
    .replace(/\\n\\n/g, '</p><p>')
    .replace(/\\n/g, '<br>');
  return '<p>' + html + '</p>';
}

// ── ROI WATERFALL CHART ──
function drawROIWaterfall() {
  var c = document.getElementById('roiWaterfallChart');
  if (!c) return;
  var W = c.offsetWidth || 500, H = 220;
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
  var ctx = c.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, W, H);

  var species = document.getElementById('roiSpeciesSelect');
  var sp = species ? species.value : 'Sapelli';

  var items = [
    {label: 'FOB Price', val: 1180, type: 'base'},
    {label: 'Freight Cost', val: -165, type: 'neg'},
    {label: 'Cert Premium', val: 96, type: 'pos'},
    {label: 'Compliance', val: -48, type: 'neg'},
    {label: 'Broker Fee', val: -18, type: 'neg'},
    {label: 'Net Margin', val: 0, type: 'total'},
  ];
  items[5].val = items.reduce(function(s, x) { return s + (x.type === 'total' ? 0 : x.val); }, 0);

  var P = {t: 20, r: 10, b: 40, l: 50};
  var cW = W - P.l - P.r, cH = H - P.t - P.b;
  var bW = cW / items.length * 0.65;
  var allVals = items.map(function(x) { return x.val; });
  var maxV = Math.max.apply(null, allVals) * 1.1;
  var minV = Math.min(0, Math.min.apply(null, allVals)) * 1.1;
  var range = maxV - minV;
  var yOf = function(v) { return P.t + (1 - (v - minV) / range) * cH; };
  var zero = yOf(0);

  ctx.strokeStyle = 'rgba(25,36,51,0.8)'; ctx.lineWidth = 0.4; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(P.l, zero); ctx.lineTo(P.l + cW, zero); ctx.stroke();
  ctx.setLineDash([]);

  var running = 0;
  items.forEach(function(item, i) {
    var x = P.l + i * (cW / items.length) + (cW / items.length - bW) / 2;
    var color, top, height;
    if (item.type === 'total') {
      color = '#22C97A';
      top = yOf(running);
      height = Math.abs(yOf(0) - yOf(running));
    } else if (item.type === 'base') {
      color = '#3A9FE8';
      top = yOf(item.val);
      height = Math.abs(yOf(0) - yOf(item.val));
      running += item.val;
    } else if (item.type === 'pos') {
      color = '#22C97A';
      top = yOf(running + item.val);
      height = Math.abs(yOf(running) - yOf(running + item.val));
      running += item.val;
    } else {
      color = '#D94040';
      top = yOf(running);
      height = Math.abs(yOf(running) - yOf(running + item.val));
      running += item.val;
    }
    ctx.fillStyle = color;
    ctx.fillRect(x, top, bW, height);
    ctx.fillStyle = '#D6E4F0';
    ctx.font = "8px 'DM Mono',monospace"; ctx.textAlign = 'center';
    ctx.fillText((item.val >= 0 ? '+' : '') + '$' + Math.abs(item.val), x + bW/2, item.val >= 0 ? top - 5 : top + height + 12);
    ctx.fillStyle = 'rgba(106,145,176,0.7)';
    ctx.fillText(item.label, x + bW/2, H - 6);
  });
  ctx.fillStyle = 'rgba(106,145,176,0.8)'; ctx.font = "7.5px 'DM Mono',monospace"; ctx.textAlign = 'left';
  for (var g = 0; g <= 5; g++) {
    var v = minV + (g/5) * range;
    ctx.fillText('$' + Math.round(v), 0, yOf(v) + 3);
  }
}

// ── OPPORTUNITY MATRIX (Scatter) ──
function drawOpportunityMatrix() {
  var c = document.getElementById('opportunityMatrix');
  if (!c) return;
  var W = c.offsetWidth || 400, H = 220;
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
  var ctx = c.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, W, H);

  var P = {t:15, r:15, b:35, l:45};
  var cW = W-P.l-P.r, cH = H-P.t-P.b;

  // Grid
  ctx.strokeStyle = 'rgba(25,36,51,0.6)'; ctx.lineWidth = 0.4;
  for (var g = 0; g <= 4; g++) {
    var gx = P.l + g*(cW/4), gy = P.t + g*(cH/4);
    ctx.beginPath(); ctx.moveTo(gx,P.t); ctx.lineTo(gx,P.t+cH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(P.l,gy); ctx.lineTo(P.l+cW,gy); ctx.stroke();
  }

  // Quadrant labels
  ctx.fillStyle = 'rgba(25,36,51,0.8)'; ctx.font = "8px 'IBM Plex Sans',sans-serif"; ctx.textAlign = 'center';
  ctx.fillText('LOW RISK / LOW ROI', P.l+cW*0.25, P.t+cH*0.85);
  ctx.fillText('LOW RISK / HIGH ROI', P.l+cW*0.75, P.t+cH*0.15);
  ctx.fillText('HIGH RISK / HIGH ROI', P.l+cW*0.75, P.t+cH*0.85);

  // Plot segments
  var xOf = function(risk) { return P.l + (risk/100)*cW; };
  var yOf = function(roi) { return P.t + (1-((roi-15)/(45-15)))*cH; };

  MARKET_SEGMENTS_BASE.forEach(function(s) {
    var x = xOf(s.risk), y = yOf(s.roi);
    var radius = 6 + (s.volume/412000)*14;
    var col = s.tier===1?'#22C97A':s.tier===2?'#E8873A':s.tier===3?'#3A9FE8':'#A07EEF';
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2);
    ctx.fillStyle = col + '33'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#D6E4F0'; ctx.font = "7.5px 'DM Mono',monospace"; ctx.textAlign='center';
    ctx.fillText(s.name.split(' ')[0], x, y+radius+10);
  });

  // Axes
  ctx.fillStyle = 'rgba(106,145,176,0.7)'; ctx.font = "8px 'DM Mono',monospace";
  ctx.textAlign='center'; ctx.fillText('Risk Score →', P.l+cW/2, H-4);
  ctx.save(); ctx.translate(10, P.t+cH/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('ROI % ↑', 0, 0); ctx.restore();
}

  var certBonus = {fsc: 8.2, pefc: 6.1, none: 0}[cert] || 0;

  var effectiveROI = (baseROI + certBonus + certCost) / 100;

  var cashFlows = [];
  var running = -invest;
  for (var y = 1; y <= years; y++) {
    var annual = invest * effectiveROI * Math.pow(1.04, y-1);
    var opCosts = invest * 0.12;
    var net = annual - opCosts;
    running += net;
    cashFlows.push({year:y, gross:annual, costs:opCosts, net:net, cumulative:running});
  }
  var totalReturn = cashFlows[cashFlows.length-1].cumulative;
  var irr = (effectiveROI * 100).toFixed(1);
  var payback = (invest / (cashFlows[0].net)).toFixed(1);
  var npv = cashFlows.reduce(function(s,cf,i) { return s + cf.net/Math.pow(1.1,i+1); }, -invest);

  // Scenario KPIs
  var kpiEl = document.getElementById('scenarioKPIs');
  if (kpiEl) {
    kpiEl.innerHTML = [
      {label:'Total Return', val:'$' + Math.round(totalReturn).toLocaleString(), color: totalReturn>0?'green2':'red2'},
      {label:'Effective ROI', val: irr + '%', color:'accent2'},
      {label:'Est. Payback', val: payback + ' yr', color:'blue2'},
      {label:'NPV (10%)', val:'$' + Math.round(npv).toLocaleString(), color:npv>0?'green2':'red2'},
    ].map(function(k) {
      return '<div class="mi-card"><div class="mi-val" style="font-size:16px;color:var(--'+k.color+');">' + k.val + '</div><div class="mi-label">' + k.label + '</div></div>';
    }).join('');
  }

  // Draw scenario chart
  var c = document.getElementById('scenarioChart');
  if (!c) return;
  var W = c.offsetWidth || 500, H = 180;
  c.width = W*devicePixelRatio; c.height = H*devicePixelRatio;
  var ctx = c.getContext('2d'); ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);
  var P = {t:10,r:15,b:25,l:60};
  var cW=W-P.l-P.r, cH=H-P.t-P.b;
  var vals = cashFlows.map(function(cf){return cf.cumulative;});
  vals.unshift(-invest);
  var minV=Math.min.apply(null,vals)*1.1, maxV=Math.max.apply(null,vals)*1.1;
  var xOf=function(i){return P.l+(i/(vals.length-1))*cW;};
  var yOf=function(v){return P.t+(1-(v-minV)/(maxV-minV))*cH;};
  var zero=yOf(0);
  ctx.strokeStyle='rgba(25,36,51,0.8)';ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(P.l,zero);ctx.lineTo(P.l+cW,zero);ctx.stroke();ctx.setLineDash([]);
  // Fill area
  ctx.beginPath();ctx.moveTo(xOf(0),yOf(vals[0]));
  vals.forEach(function(v,i){ctx.lineTo(xOf(i),yOf(v));});
  ctx.lineTo(xOf(vals.length-1),H);ctx.lineTo(xOf(0),H);ctx.closePath();
  var grad=ctx.createLinearGradient(0,P.t,0,H);
  grad.addColorStop(0,'rgba(34,201,122,0.25)');grad.addColorStop(1,'rgba(34,201,122,0.02)');
  ctx.fillStyle=grad;ctx.fill();
  // Line
  ctx.beginPath();ctx.strokeStyle='#22C97A';ctx.lineWidth=2;ctx.lineJoin='round';
  vals.forEach(function(v,i){i===0?ctx.moveTo(xOf(i),yOf(v)):ctx.lineTo(xOf(i),yOf(v));});ctx.stroke();
  // Dots
  vals.forEach(function(v,i){
    ctx.beginPath();ctx.arc(xOf(i),yOf(v),3.5,0,Math.PI*2);
    ctx.fillStyle=v>=0?'#22C97A':'#D94040';ctx.fill();
  });
  // x labels
  ctx.fillStyle='rgba(106,145,176,0.7)';ctx.font="7.5px 'DM Mono',monospace";ctx.textAlign='center';
  vals.forEach(function(_,i){ctx.fillText(i===0?'Y0':'Y'+i,xOf(i),H-4);});
  // y labels
  ctx.textAlign='left';
  for(var g=0;g<=4;g++){var v2=minV+(g/4)*(maxV-minV);ctx.fillText((v2>=0?'$':'-$')+Math.abs(Math.round(v2/1000))+'K',0,yOf(v2)+3);}
}

// ── RISK-RETURN CHART ──
function drawRiskReturn() {
  var c = document.getElementById('riskReturnChart');
  if (!c) return;
  var W = c.offsetWidth||350, H=200;
  c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
  var ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);
  var P={t:15,r:15,b:30,l:40};
  var cW=W-P.l-P.r,cH=H-P.t-P.b;
  // Grid
  ctx.strokeStyle='rgba(25,36,51,0.5)';ctx.lineWidth=0.4;
  for(var g=0;g<=4;g++){
    ctx.beginPath();ctx.moveTo(P.l+g*(cW/4),P.t);ctx.lineTo(P.l+g*(cW/4),P.t+cH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(P.l,P.t+g*(cH/4));ctx.lineTo(P.l+cW,P.t+g*(cH/4));ctx.stroke();
  }
  // Efficient frontier curve
  ctx.beginPath();ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(212,162,42,0.4)';ctx.lineWidth=1.5;
  ctx.moveTo(P.l+cW*0.1,P.t+cH*0.85);
  ctx.bezierCurveTo(P.l+cW*0.25,P.t+cH*0.5,P.l+cW*0.5,P.t+cH*0.2,P.l+cW*0.9,P.t+cH*0.05);
  ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(212,162,42,0.6)';ctx.font="7px 'DM Mono',monospace";ctx.textAlign='left';
  ctx.fillText('Efficient Frontier',P.l+cW*0.3,P.t+cH*0.32);
  // Segments
  var xOf=function(risk){return P.l+(risk/100)*cW;};
  var yOf=function(roi){return P.t+(1-((roi-15)/(48-15)))*cH;};
  MARKET_SEGMENTS_BASE.forEach(function(s){
    var x=xOf(s.risk),y=yOf(s.roi);
    var col=s.tier===1?'#22C97A':s.tier===2?'#E8873A':s.tier===3?'#3A9FE8':'#A07EEF';
    ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle=col+'99';ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#D6E4F0';ctx.font="7px 'DM Mono',monospace";ctx.textAlign='center';
    ctx.fillText(s.name.split(' ')[0],x,y+15);
  });
  // Axes
  ctx.fillStyle='rgba(106,145,176,0.7)';ctx.font="8px 'DM Mono',monospace";
  ctx.textAlign='center';ctx.fillText('Risk Score →',P.l+cW/2,H-3);
  ctx.save();ctx.translate(10,P.t+cH/2);ctx.rotate(-Math.PI/2);ctx.fillText('ROI % ↑',0,0);ctx.restore();
  // Legend
  var legend=document.getElementById('riskReturnLegend');
  if(legend)legend.innerHTML=[
    {col:'#22C97A',label:'Tier 1 — Premium Certified (Highest ROI)'},
    {col:'#E8873A',label:'Tier 2 — Established Markets'},
    {col:'#3A9FE8',label:'Tier 3 — Emerging / High Volume'},
    {col:'#A07EEF',label:'Tier 4 — Emerging / Speculative'},
  ].map(function(l){return '<div style="display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text2);"><div style="width:10px;height:10px;border-radius:50%;background:'+l.col+';flex-shrink:0;"></div>'+l.label+'</div>';}).join('');
}

// LIVE PRICE TICKER
// ════════════════════════════════════════════════════════
var tickerPrices = {};
var tickerDir = {};

function initTicker() {
  var track = document.getElementById('tickerTrack');
  if (!track) return;
  // Seed prices
  SPECIES_30.forEach(function(sp) {
    var basePrice = MARKETS_15.find(function(m){return m.code==='EU';}) ? MARKETS_15[0].price : 1000;
    tickerPrices[sp] = 800 + Math.random() * 600;
    tickerDir[sp] = Math.random() > 0.5 ? 1 : -1;
  });
  renderTicker();
  setInterval(updateTicker, 2800);
}

function updateTicker() {
  SPECIES_30.forEach(function(sp) {
    var drift = (Math.random() - 0.47) * tickerPrices[sp] * 0.008;
    var prev = tickerPrices[sp];
    tickerPrices[sp] = Math.max(350, prev + drift);
    tickerDir[sp] = tickerPrices[sp] >= prev ? 1 : -1;
  });
  renderTicker();
}

function renderTicker() {
  var track = document.getElementById('tickerTrack');
  if (!track) return;
  // Build items × 2 for seamless loop
  var items = SPECIES_30.map(function(sp) {
    var p = tickerPrices[sp], dir = tickerDir[sp];
    var chgPct = (Math.random() * 3.8 * dir).toFixed(1);
    var up = dir >= 0;
    return '<div class="ticker-item">'
      + '<div class="ticker-dot ' + (up ? 'up' : 'dn') + '"></div>'
      + '<span class="ticker-sp">' + sp + '</span>'
      + '<span class="ticker-price">$' + Math.round(p) + '/m³</span>'
      + '<span class="ticker-chg ' + (up ? 'up' : 'dn') + '">' + (up ? '+' : '') + chgPct + '%</span>'
      + '</div>';
  }).join('');
  track.innerHTML = items + items; // duplicate for seamless scroll
}
