server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve the dashboard.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the backend service (same-origin for the browser).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz { proxy_pass http://api:4000/healthz; }
  location = /readyz  { proxy_pass http://api:4000/readyz; }
}
