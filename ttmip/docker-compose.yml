services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ttmip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttmip}
      POSTGRES_DB: ${POSTGRES_DB:-ttmip}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ttmip}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ttmip}:${POSTGRES_PASSWORD:-ttmip}@db:5432/${POSTGRES_DB:-ttmip}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      CORS_ORIGIN: http://localhost:8080
    # Migrate + seed demo data + start (seed is idempotent: it resets demo data).
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  db_data:
